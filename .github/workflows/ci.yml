name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Behavior: rewritten code is behavior-identical to the source.
      - name: behavior — run_examples
        run: python tests/run_examples.py
      # Effectiveness: code smell density drops (BEFORE -> AFTER) + LOC shorter.
      - name: code smell-density — benchmark
        run: python tests/benchmark.py
      # Generalization: a fresh unseen sample still de-AIs cleanly.
      - name: generalization — demo_fresh
        run: python tests/demo_fresh.py
      # Prose: AI tell density drops (BEFORE -> AFTER).
      - name: prose tell-density — test_prose
        run: python tests/test_prose.py
      # Structural smells via real AST (Python ast/tokenize), not regex.
      - name: AST smell — test_ast
        run: python tests/test_ast.py
      # Multi-language regression: py/ts/go corpus before/after (gap #8).
      - name: corpus regression — test_corpus
        run: python tests/test_corpus.py
      # Third-party endorsement harness (skips without an API key).
      - name: third-party detector — third_party_detector
        run: python tests/third_party_detector.py
      # End-to-end: an agent follows code-humanizer on an UNSEEN snippet,
      # output must be smell-free (AST) and behavior-preserving (gap #4).
      - name: agent end-to-end — test_e2e_agent
        run: python tests/test_e2e_agent.py
